name: Build shells (APK / IPA / EXE)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'desktop/**'
      - '.github/workflows/build-shells.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build APKs (debug + release)
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease
      - name: Sign release APK (if signing secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "signing secrets not set - skipping"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cnkh-release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cnkh-release.jks" --ks-pass env:STORE_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out android/app/build/outputs/apk/release/app-release-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cnkh-pos2-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cnkh-pos2-android-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: ignore

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - run: npx cap sync ios
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install
      - name: Build unsigned app
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r cnkh-pos2-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: cnkh-pos2-ios-unsigned-ipa
          path: ios/App/cnkh-pos2-unsigned.ipa

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build portable EXE
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: cnkh-pos2-windows-exe
          path: desktop/dist/*.exe
